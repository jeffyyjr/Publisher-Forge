<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publisher Forge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f4f7fb;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      color: #aab4c8;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #17213b;
      color: #b8c8ff;
      font-size: 14px;
    }

    .card {
      background: #121a2e;
      border: 1px solid #263352;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #34415f;
      background: #0d1425;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .range-row {
      margin-top: 16px;
    }

    .range-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    input[type="range"] {
      padding: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #25304b;
    }

    button:disabled {
      opacity: .6;
    }

    .result {
      white-space: pre-wrap;
      line-height: 1.55;
      background: #0d1425;
      border-radius: 10px;
      padding: 14px;
      min-height: 70px;
      color: #dfe6f5;
    }

    .verdict {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .small {
      color: #9ba8bf;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="header">
      <div class="status" id="status">Checking backend...</div>

      <h1>Publisher Forge</h1>

      <p>
        AI-assisted opportunity research and product development for
        Amazon KDP and Etsy.
      </p>
    </div>

    <div class="card">
      <h2>Opportunity Analyzer</h2>

      <label for="title">Product idea</label>
      <input
        id="title"
        placeholder="Example: ADHD daily planner for night-shift workers"
      >

      <label for="platform">Platform</label>
      <select id="platform">
        <option value="KDP">Amazon KDP</option>
        <option value="Etsy">Etsy</option>
      </select>

      <div class="range-row">
        <div class="range-head">
          <span>Demand</span>
          <span id="demandValue">60</span>
        </div>
        <input id="demand" type="range" min="0" max="100" value="60">
      </div>

      <div class="range-row">
        <div class="range-head">
          <span>Competition</span>
          <span id="competitionValue">50</span>
        </div>
        <input id="competition" type="range" min="0" max="100" value="50">
      </div>

      <div class="range-row">
        <div class="range-head">
          <span>Margin potential</span>
          <span id="marginValue">65</span>
        </div>
        <input id="margin" type="range" min="0" max="100" value="65">
      </div>

      <div class="range-row">
        <div class="range-head">
          <span>Differentiation</span>
          <span id="differentiationValue">60</span>
        </div>
        <input
          id="differentiation"
          type="range"
          min="0"
          max="100"
          value="60"
        >
      </div>

      <div class="range-row">
        <div class="range-head">
          <span>Confidence</span>
          <span id="confidenceValue">60</span>
        </div>
        <input id="confidence" type="range" min="0" max="100" value="60">
      </div>

      <button id="analyzeButton" onclick="analyzeIdea()">
        Analyze Opportunity
      </button>
    </div>

    <div class="card hidden" id="analysisCard">
      <h2>Decision</h2>
      <div class="verdict" id="verdict"></div>
      <div class="result" id="analysisResult"></div>

      <button
        class="secondary"
        onclick="generateBrief()"
        id="briefButton"
      >
        Generate Product Brief
      </button>
    </div>

    <div class="card hidden" id="briefCard">
      <h2>Product Architect</h2>

      <label for="notes">Extra instructions</label>
      <textarea
        id="notes"
        placeholder="Optional notes about audience, style, format, etc."
      ></textarea>

      <button onclick="generateBrief()">
        Generate / Regenerate Brief
      </button>

      <div class="result" id="briefResult" style="margin-top:16px;"></div>
    </div>

  </div>

<script>
  const sliders = [
    "demand",
    "competition",
    "margin",
    "differentiation",
    "confidence"
  ];

  sliders.forEach(id => {
    const slider = document.getElementById(id);
    const output = document.getElementById(id + "Value");

    slider.addEventListener("input", () => {
      output.textContent = slider.value;
    });
  });

  async function checkHealth() {
    const status = document.getElementById("status");

    try {
      const response = await fetch("/api/health");
      const data = await response.json();

      if (data.ok && data.openaiConfigured) {
        status.textContent = "● Backend + OpenAI connected";
      } else if (data.ok) {
        status.textContent = "● Backend live — OpenAI not configured";
      } else {
        status.textContent = "Backend error";
      }
    } catch (error) {
      status.textContent = "Backend unavailable";
    }
  }

  async function analyzeIdea() {
    const button = document.getElementById("analyzeButton");
    const title = document.getElementById("title").value.trim();

    if (!title) {
      alert("Enter a product idea first.");
      return;
    }

    button.disabled = true;
    button.textContent = "Analyzing...";

    document.getElementById("analysisCard").classList.remove("hidden");
    document.getElementById("verdict").textContent = "";
    document.getElementById("analysisResult").textContent =
      "Publisher Forge is evaluating this opportunity...";

    const body = {
      title,
      platform: document.getElementById("platform").value,
      demand: Number(document.getElementById("demand").value),
      competition: Number(document.getElementById("competition").value),
      margin: Number(document.getElementById("margin").value),
      differentiation: Number(
        document.getElementById("differentiation").value
      ),
      confidence: Number(document.getElementById("confidence").value)
    };

    try {
      const response = await fetch("/api/analyze", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || data.error || "Analysis failed");
      }

      document.getElementById("verdict").textContent =
        `${data.verdict || "RESULT"} — Score ${data.score ?? "?"}/100`;

      document.getElementById("analysisResult").textContent =
        data.aiAnalysis ||
        (data.reasoning ? data.reasoning.join("\n") : "Analysis complete.");

    } catch (error) {
      document.getElementById("analysisResult").textContent =
        "Error: " + error.message;
    } finally {
      button.disabled = false;
      button.textContent = "Analyze Opportunity";
    }
  }

  async function generateBrief() {
    const title = document.getElementById("title").value.trim();

    if (!title) {
      alert("Enter a product idea first.");
      return;
    }

    document.getElementById("briefCard").classList.remove("hidden");
    document.getElementById("briefResult").textContent =
      "Product Architect is building the brief...";

    const body = {
      title,
      platform: document.getElementById("platform").value,
      notes: document.getElementById("notes").value
    };

    try {
      const response = await fetch("/api/product-brief", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "Brief generation failed"
        );
      }

      document.getElementById("briefResult").textContent = data.brief;

    } catch (error) {
      document.getElementById("briefResult").textContent =
        "Error: " + error.message;
    }
  }

  checkHealth();
</script>

</body>
</html>
